name: Rebuild blog
on:
  push:
    paths: ['content/blog/**', '_gen_blog.py', '_build_page.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install markdown pyyaml
      - run: python _gen_blog.py
      - name: Commit generated blog
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog.html blog-*.html
          git diff --cached --quiet || git commit -m "rebuild blog [skip ci]"
          git push
